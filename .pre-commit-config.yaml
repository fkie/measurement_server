repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: 1.40.2
    hooks:
      - id: basedpyright
        # Only the Python package is type checked (launch files need ROS)
        files: ^fkie_measurement_server/.*\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6  # run "pre-commit autoupdate" to get the latest tag
    hooks:
      - id: ruff
